name: Build APK (test terminal)

on:
  push:
    branches:
      - 'pres-/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Version alignée sur le projet (Gradle 8.12 / AGP 8.7.3 / Dart >= 3.8)
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Tests DataMatrix et ordonnance
        run: flutter test test/datamatrix_parser_test.dart test/expiration_update_datamatrix_test.dart test/prescription_check_test.dart test/label_text_parser_test.dart

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: prestige-vente-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
