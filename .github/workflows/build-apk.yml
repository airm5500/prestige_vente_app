name: Build APK (test terminal)

on:
  push:
    branches:
      - 'pres-/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Version alignée sur le projet (Gradle 8.12 / AGP 8.7.3 / Dart >= 3.8)
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Tests (unitaires, écrans, intégration, e2e, non-régression, ergonomie, performance, réseau)
        run: mkdir -p build/rapport_tests && flutter test test/datamatrix_parser_test.dart test/expiration_update_datamatrix_test.dart test/prescription_check_test.dart test/label_text_parser_test.dart test/camera_scan_value_test.dart test/ocr_rows_test.dart test/fingerprint_diagnostic_test.dart test/licence_lookup_test.dart test/pointage_analytics_test.dart test/pointage_kiosk_test.dart test/pointage_badge_test.dart test/pointage_nfc_test.dart test/guided_capture_test.dart test/reception_bl_test.dart test/retour_frs_test.dart test/presentation_screens_test.dart test/presentation_pointage_test.dart test/presentation_perimes_test.dart test/presentation_delivery_ean_test.dart test/presentation_caisse_eval_search_test.dart test/presentation_reception_control_test.dart test/presentation_bl_control_test.dart test/sync_load_errors_test.dart test/presentation_emplacement_test.dart test/presentation_stock_report_test.dart test/presentation_depot_sale_test.dart test/presentation_ajustement_test.dart test/ventes_core_test.dart test/ventes_common_test.dart test/ventes_prevente_test.dart test/product_lookup_test.dart test/ventes_carnet_test.dart test/ventes_assurance_test.dart test/ventes_recherche_test.dart test/recherche_produit_menus_test.dart test/ventes_prevente_ui_test.dart test/ventes_assurance_ui_test.dart test/parametres_test.dart test/ventes_carnet_ui_test.dart test/accueil_test.dart test/recherche_mode_test.dart test/paiement_multiple_test.dart test/responsive_test.dart test/horsligne_test.dart test/horsligne_stock_test.dart test/accueil_connexion_test.dart test/horsligne_ventes_test.dart test/horsligne_h4_test.dart test/journal_terminal_test.dart test/ordonnances_banc_test.dart test/ordonnances_o2_test.dart test/ordonnances_o3_test.dart test/horsligne_delta_test.dart test/routes_app_vente_test.dart test/borne_test.dart test/images_produits_test.dart test/support_centre_test.dart test/rh_pointage_test.dart test/ordonnances_o4_test.dart test/ordonnances_o3b_test.dart test/ordonnances_o5_test.dart test/paiements_mobile_test.dart test/securite_identifiants_test.dart test/retours_accueil_test.dart test/securite_codes_test.dart test/modes_paiement_logo_test.dart test/connexion_lancement_test.dart test/scan_fiche_analyse_test.dart test/vente_clavier_test.dart test/session_renouvelee_test.dart test/stock_reserve_test.dart test/retours_video_test.dart test/session_expiree_test.dart test/pointage_photo_test.dart test/pointage_photo_integration_test.dart test/client_prestige_test.dart test/client_prestige_session_test.dart test/droits_modules_test.dart test/reserve_test.dart test/posos_test.dart test/fiche_client_test.dart test/faux_serveur_prestige_test.dart test/integration_services_test.dart test/e2e_parcours_test.dart test/ergonomie_test.dart test/non_regression_test.dart test/version_sunmi_test.dart test/version_affichee_test.dart test/taille_ecran_test.dart test/ergonomie_taille_ecran_test.dart test/widget_test.dart test/configuration_origine_test.dart test/recherche_debut_cip_test.dart test/https_adresse_test.dart test/https_integration_test.dart test/https_configuration_test.dart test/ticket_prevente_test.dart test/retours_pharmacien_test.dart test/recherche_rapide_info_test.dart test/sortie_borne_test.dart test/reponse_serveur_test.dart test/performance/demarrage_test.dart test/performance/listes_longues_test.dart test/performance/requetes_test.dart test/performance/traitement_local_test.dart test/reseau/serveur_lent_test.dart test/reseau/reponses_tronquees_test.dart test/reseau/coupures_reprise_test.dart test/reseau/adresse_serveur_test.dart test/reseau/https_test.dart test/lenteur_detail_432_test.dart test/ergonomie_analyse_432_test.dart test/reseau/redeploiement_test.dart test/reseau/indisponible_replis_test.dart test/scan_peremption_test.dart test/photos_produits_test.dart test/empreintes_partagees_test.dart test/pointage_reglages_e2e_test.dart test/pointage_compte_lie_e2e_test.dart test/reseau/empreintes_reseau_test.dart test/performance/empreintes_test.dart test/android_play_test.dart test/droits_vente_test.dart test/droits_vente_e2e_test.dart test/borne_droits_test.dart test/reseau/droits_vente_reseau_test.dart test/reponse_serveur_1910_test.dart test/reponse_serveur_1910_e2e_test.dart test/badge_qr_test.dart test/badge_qr_e2e_test.dart test/reseau/pointage_session_reseau_test.dart --file-reporter json:build/rapport_tests/tests.json

      # Rapport de tests de livraison : résumé par catégorie (test/categories.json) + mesures de performance et de
      # requêtes, dans le résumé du job et en artefact « rapport-tests » (à côté de l'APK). Produit même si des
      # tests échouent (l'APK n'est alors pas construit).
      - name: Rapport de tests de livraison
        if: ${{ !cancelled() }}
        shell: bash
        run: dart run tool/rapport_tests.dart build/rapport_tests | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: rapport-tests
          path: |
            build/rapport_tests/rapport.md
            build/rapport_tests/resume.json
            build/rapport_tests/tests.json
          retention-days: 30

      - name: Build APK
        run: flutter build apk --release

      # La version de l'APK construit doit être celle de pubspec.yaml (docs/VERSIONS_SUNMI.md : source unique).
      - name: Version de l'APK (= pubspec.yaml)
        shell: bash
        run: |
          meta=$(find build/app/outputs -name output-metadata.json | head -1)
          cat "$meta"
          attendu=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '[:space:]')
          apk=$(python3 -c "import json,sys; e=json.load(open(sys.argv[1]))['elements'][0]; print(f\"{e['versionName']}+{e['versionCode']}\")" "$meta")
          echo "pubspec.yaml : $attendu · APK : $apk"
          if [ "$attendu" != "$apk" ]; then echo "::error title=Version de l'APK::APK $apk ≠ pubspec.yaml $attendu"; exit 1; fi
          echo "::notice title=Version de l'APK::$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: prestige-vente-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
