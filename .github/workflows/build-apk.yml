name: Build APK (test terminal)

on:
  push:
    branches:
      - 'pres-/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Version alignée sur le projet (Gradle 8.12 / AGP 8.7.3 / Dart >= 3.8)
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Tests DataMatrix et ordonnance
        run: flutter test test/datamatrix_parser_test.dart test/expiration_update_datamatrix_test.dart test/prescription_check_test.dart test/label_text_parser_test.dart test/camera_scan_value_test.dart test/ocr_rows_test.dart test/fingerprint_diagnostic_test.dart test/licence_lookup_test.dart test/pointage_analytics_test.dart test/pointage_kiosk_test.dart test/pointage_badge_test.dart test/pointage_nfc_test.dart test/guided_capture_test.dart test/reception_bl_test.dart test/retour_frs_test.dart test/presentation_screens_test.dart test/presentation_pointage_test.dart test/presentation_perimes_test.dart test/presentation_delivery_ean_test.dart test/presentation_caisse_eval_search_test.dart test/presentation_reception_control_test.dart test/presentation_bl_control_test.dart test/sync_load_errors_test.dart test/presentation_emplacement_test.dart test/presentation_stock_report_test.dart test/presentation_depot_sale_test.dart test/presentation_ajustement_test.dart test/ventes_core_test.dart test/ventes_common_test.dart test/ventes_prevente_test.dart test/product_lookup_test.dart test/ventes_carnet_test.dart test/ventes_assurance_test.dart test/ventes_recherche_test.dart test/recherche_produit_menus_test.dart test/ventes_prevente_ui_test.dart test/ventes_assurance_ui_test.dart test/parametres_test.dart test/ventes_carnet_ui_test.dart test/accueil_test.dart test/recherche_mode_test.dart test/paiement_multiple_test.dart test/responsive_test.dart test/horsligne_test.dart test/horsligne_stock_test.dart test/accueil_connexion_test.dart test/horsligne_ventes_test.dart test/horsligne_h4_test.dart

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: prestige-vente-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
