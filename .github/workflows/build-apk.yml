name: Build APK (test terminal)

on:
  push:
    # Branches de travail (Prestige Mobile) et branche de PrestigePOS (saveur pos, job « prestigepos »).
    branches: ['pres-/**', 'prestigepos']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Version alignée sur le projet (Gradle 8.12 / AGP 8.7.3 / Dart >= 3.8)
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Tests (unitaires, écrans, intégration, e2e, non-régression, ergonomie, performance, réseau)
        run: mkdir -p build/rapport_tests && flutter test test/datamatrix_parser_test.dart test/expiration_update_datamatrix_test.dart test/prescription_check_test.dart test/label_text_parser_test.dart test/camera_scan_value_test.dart test/ocr_rows_test.dart test/fingerprint_diagnostic_test.dart test/licence_lookup_test.dart test/pointage_analytics_test.dart test/pointage_kiosk_test.dart test/pointage_badge_test.dart test/pointage_nfc_test.dart test/guided_capture_test.dart test/reception_bl_test.dart test/retour_frs_test.dart test/presentation_screens_test.dart test/presentation_pointage_test.dart test/presentation_perimes_test.dart test/presentation_delivery_ean_test.dart test/presentation_caisse_eval_search_test.dart test/presentation_reception_control_test.dart test/presentation_bl_control_test.dart test/sync_load_errors_test.dart test/presentation_emplacement_test.dart test/presentation_stock_report_test.dart test/presentation_depot_sale_test.dart test/presentation_ajustement_test.dart test/ventes_core_test.dart test/ventes_common_test.dart test/ventes_prevente_test.dart test/product_lookup_test.dart test/ventes_carnet_test.dart test/ventes_assurance_test.dart test/ventes_recherche_test.dart test/recherche_produit_menus_test.dart test/ventes_prevente_ui_test.dart test/ventes_assurance_ui_test.dart test/parametres_test.dart test/ventes_carnet_ui_test.dart test/accueil_test.dart test/recherche_mode_test.dart test/paiement_multiple_test.dart test/responsive_test.dart test/horsligne_test.dart test/horsligne_stock_test.dart test/accueil_connexion_test.dart test/horsligne_ventes_test.dart test/horsligne_h4_test.dart test/journal_terminal_test.dart test/ordonnances_banc_test.dart test/ordonnances_o2_test.dart test/ordonnances_o3_test.dart test/horsligne_delta_test.dart test/routes_app_vente_test.dart test/borne_test.dart test/images_produits_test.dart test/support_centre_test.dart test/rh_pointage_test.dart test/ordonnances_o4_test.dart test/ordonnances_o3b_test.dart test/ordonnances_o5_test.dart test/paiements_mobile_test.dart test/securite_identifiants_test.dart test/retours_accueil_test.dart test/securite_codes_test.dart test/modes_paiement_logo_test.dart test/connexion_lancement_test.dart test/scan_fiche_analyse_test.dart test/vente_clavier_test.dart test/session_renouvelee_test.dart test/stock_reserve_test.dart test/retours_video_test.dart test/session_expiree_test.dart test/pointage_photo_test.dart test/pointage_photo_integration_test.dart test/client_prestige_test.dart test/client_prestige_session_test.dart test/droits_modules_test.dart test/reserve_test.dart test/posos_test.dart test/fiche_client_test.dart test/faux_serveur_prestige_test.dart test/integration_services_test.dart test/e2e_parcours_test.dart test/ergonomie_test.dart test/non_regression_test.dart test/version_sunmi_test.dart test/version_affichee_test.dart test/taille_ecran_test.dart test/ergonomie_taille_ecran_test.dart test/widget_test.dart test/configuration_origine_test.dart test/recherche_debut_cip_test.dart test/https_adresse_test.dart test/https_integration_test.dart test/https_configuration_test.dart test/ticket_prevente_test.dart test/retours_pharmacien_test.dart test/recherche_rapide_info_test.dart test/sortie_borne_test.dart test/reponse_serveur_test.dart test/performance/demarrage_test.dart test/performance/listes_longues_test.dart test/performance/requetes_test.dart test/performance/traitement_local_test.dart test/reseau/serveur_lent_test.dart test/reseau/reponses_tronquees_test.dart test/reseau/coupures_reprise_test.dart test/reseau/adresse_serveur_test.dart test/reseau/https_test.dart test/lenteur_detail_432_test.dart test/ergonomie_analyse_432_test.dart test/reseau/redeploiement_test.dart test/reseau/indisponible_replis_test.dart test/scan_peremption_test.dart test/photos_produits_test.dart test/empreintes_partagees_test.dart test/pointage_reglages_e2e_test.dart test/pointage_compte_lie_e2e_test.dart test/reseau/empreintes_reseau_test.dart test/performance/empreintes_test.dart test/android_play_test.dart test/droits_vente_test.dart test/droits_vente_e2e_test.dart test/borne_droits_test.dart test/reseau/droits_vente_reseau_test.dart test/reponse_serveur_1910_test.dart test/reponse_serveur_1910_e2e_test.dart test/badge_qr_test.dart test/badge_qr_e2e_test.dart test/nom_appareil_test.dart test/nom_appareil_e2e_test.dart test/nom_appareil_garde_test.dart test/journal_debug_test.dart test/nom_appareil_serveur_e2e_test.dart test/reseau/nom_appareil_serveur_reseau_test.dart test/reseau/nom_appareil_reseau_test.dart test/performance/nom_appareil_perf_test.dart test/gs1_vente_test.dart test/gs1_vente_e2e_test.dart test/reseau/gs1_vente_reseau_test.dart test/performance/gs1_vente_perf_test.dart test/gs1_depot_proforma_test.dart test/gs1_depot_proforma_e2e_test.dart test/reseau/gs1_depot_proforma_reseau_test.dart test/performance/gs1_depot_proforma_perf_test.dart test/gs1_etendue_test.dart test/gs1_etendue_e2e_test.dart test/reseau/gs1_etendue_reseau_test.dart test/performance/gs1_etendue_perf_test.dart test/reseau/pointage_session_reseau_test.dart test/prestigepointage/signature_borne_test.dart test/prestigepointage/prestigepointage_test.dart test/prestigepointage/client_borne_test.dart test/prestigepointage/pointage_e2e_test.dart test/prestigepointage/mobile_pointer_e2e_test.dart test/prestigepointage/pointage_ergonomie_test.dart test/prestigepointage/prestigepointage_garde_test.dart test/reseau/prestigepointage_reseau_test.dart test/performance/prestigepointage_perf_test.dart --file-reporter json:build/rapport_tests/tests.json

      # Rapport de tests de livraison : résumé par catégorie (test/categories.json) + mesures de performance et de
      # requêtes, dans le résumé du job et en artefact « rapport-tests » (à côté de l'APK). Produit même si des
      # tests échouent (l'APK n'est alors pas construit).
      - name: Rapport de tests de livraison
        if: ${{ !cancelled() }}
        shell: bash
        run: dart run tool/rapport_tests.dart build/rapport_tests | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: rapport-tests
          path: |
            build/rapport_tests/rapport.md
            build/rapport_tests/resume.json
            build/rapport_tests/tests.json
          retention-days: 30

      # Commande inchangée : la saveur `mobile` (Prestige Mobile) est la saveur par défaut (pubspec.yaml,
      # flutter › default-flavor), même applicationId, même nom, mêmes permissions.
      - name: Build APK
        run: flutter build apk --release

      # La version de l'APK construit doit être celle de pubspec.yaml (docs/VERSIONS_SUNMI.md : source unique).
      - name: Version de l'APK (= pubspec.yaml)
        shell: bash
        run: |
          meta=$(find build/app/outputs -name output-metadata.json | head -1)
          cat "$meta"
          attendu=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '[:space:]')
          apk=$(python3 -c "import json,sys; e=json.load(open(sys.argv[1]))['elements'][0]; print(f\"{e['versionName']}+{e['versionCode']}\")" "$meta")
          echo "pubspec.yaml : $attendu · APK : $apk"
          if [ "$attendu" != "$apk" ]; then echo "::error title=Version de l'APK::APK $apk ≠ pubspec.yaml $attendu"; exit 1; fi
          echo "::notice title=Version de l'APK::$apk"

      # Saveurs Android : Flutter nomme l'APK « app-mobile-release.apk » ; l'artefact garde le nom d'origine
      # « app-release.apk ». Identité et permissions relevées pour la comparaison avec 4.10.0+36 (job suivant).
      - name: APK Prestige Mobile (nom d'origine) et permissions
        shell: bash
        run: |
          cd build/app/outputs/flutter-apk
          if [ -f app-mobile-release.apk ]; then mv app-mobile-release.apk app-release.apk; fi
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2
          "$aapt2" dump badging app-release.apk | grep -E "^(package|application-label):" | sed -E "s/ platformBuildVersion.*//" > identite-mobile.txt
          "$aapt2" dump permissions app-release.apk | grep -E "^(uses-permission|permission)" | sort > permissions-mobile.txt
          cat identite-mobile.txt permissions-mobile.txt
          if grep -qiE "BLUETOOTH|usb" permissions-mobile.txt; then echo "::error title=Prestige Mobile::permission Bluetooth/USB de PrestigePOS dans Prestige Mobile"; exit 1; fi
          if grep -q "prestigepointage" identite-mobile.txt; then echo "::error title=Prestige Mobile::identité de Prestige Pointage dans Prestige Mobile"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: prestige-vente-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: prestige-mobile-identite
          path: |
            build/app/outputs/flutter-apk/identite-mobile.txt
            build/app/outputs/flutter-apk/permissions-mobile.txt
          retention-days: 30

  # Non-régression de Prestige Mobile : l'APK construit ici a le MÊME applicationId, le même nom, la même version
  # et EXACTEMENT les mêmes permissions que celui de la version de référence 4.10.0+36 (Prestige Mobile avant sa fusion dans PrestigePOS).
  prestige-mobile-identique:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REFERENCE_MOBILE: e0fdc765eef4cc51935049fca0b7d3e459e09735  # 4.10.0+36, avant la fusion dans PrestigePOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REFERENCE_MOBILE }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: APK de référence (4.10.0+36)
        run: flutter build apk --release
      - uses: actions/download-artifact@v4
        with:
          name: prestige-mobile-identite
          path: actuel
      - name: Comparaison identité et permissions
        shell: bash
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2
          # Depuis la 4.10.0 (saveurs), Flutter nomme l'APK de la saveur par défaut « app-mobile-release.apk ».
          ref=$(ls build/app/outputs/flutter-apk/app-mobile-release.apk build/app/outputs/flutter-apk/app-release.apk 2>/dev/null | head -1)
          "$aapt2" dump badging "$ref" | grep -E "^(package|application-label):" | sed -E "s/ platformBuildVersion.*//" > identite-reference.txt
          "$aapt2" dump permissions "$ref" | grep -E "^(uses-permission|permission)" | sort > permissions-reference.txt
          {
            echo "## Prestige Mobile identique à $REFERENCE_MOBILE"
            echo '```diff'
            diff -u identite-reference.txt actuel/identite-mobile.txt && echo "identité : identique"
            diff -u permissions-reference.txt actuel/permissions-mobile.txt && echo "permissions : identiques ($(wc -l < permissions-reference.txt))"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          diff -u identite-reference.txt actuel/identite-mobile.txt
          diff -u permissions-reference.txt actuel/permissions-mobile.txt

  # PrestigePOS (saveur `pos`, lib/main_pos.dart) : tests, APK, version (android/app/prestigepos-version.properties), résumé des tests.
  prestigepos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Tests PrestigePOS
        run: flutter test test/prestigepos --file-reporter json:resultats-prestigepos.json

      - name: Résumé des tests
        if: always()
        run: python3 .github/scripts/resume_tests.py resultats-prestigepos.json "Tests PrestigePOS" >> "$GITHUB_STEP_SUMMARY"

      - name: Build APK PrestigePOS
        run: flutter build apk --release --flavor pos -t lib/main_pos.dart

      # Version de PrestigePOS : android/app/prestigepos-version.properties (pas pubspec.yaml).
      - name: Version, identité et permissions de l'APK PrestigePOS
        shell: bash
        run: |
          apk=build/app/outputs/flutter-apk/app-pos-release.apk
          nom=$(sed -n 's/^nomVersion=//p' android/app/prestigepos-version.properties | tr -d '[:space:]')
          code=$(sed -n 's/^codeVersion=//p' android/app/prestigepos-version.properties | tr -d '[:space:]')
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2
          "$aapt2" dump badging "$apk" | grep -E "^(package|application-label|launchable-activity):"
          "$aapt2" dump badging "$apk" | grep -q "package: name='com.dici.prestigepos' versionCode='$code' versionName='$nom'"             || { echo "::error title=PrestigePOS::applicationId/version attendus com.dici.prestigepos $nom+$code"; exit 1; }
          "$aapt2" dump badging "$apk" | grep -q "application-label:'PrestigePOS'" || { echo "::error title=PrestigePOS::nom affiché"; exit 1; }
          "$aapt2" dump permissions "$apk" | sort
          "$aapt2" dump permissions "$apk" | grep -q "BLUETOOTH_CONNECT" || { echo "::error title=PrestigePOS::permission Bluetooth absente"; exit 1; }
          # 1.1.0 : démarrage automatique de la borne avec l'appareil (récepteur BOOT_COMPLETED, saveur pos seulement).
          "$aapt2" dump permissions "$apk" | grep -q "RECEIVE_BOOT_COMPLETED" || { echo "::error title=PrestigePOS::permission de démarrage absente"; exit 1; }
          mkdir -p prestigepos-apk
          cp "$apk" "prestigepos-apk/PrestigePOS-$nom.apk"
          {
            echo "## APK PrestigePOS"
            echo "- \`com.dici.prestigepos\` · version **$nom+$code** · $(du -h "$apk" | cut -f1)"
            echo "- Artefact : \`prestigepos-apk\` (PrestigePOS-$nom.apk)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=PrestigePOS::$nom+$code"

      - uses: actions/upload-artifact@v4
        with:
          name: prestigepos-apk
          path: prestigepos-apk/*.apk
          retention-days: 30

  # Prestige Pointage (saveur `pointage`, lib/main_pointage.dart, demande 57) : APK, version
  # (android/app/prestigepointage-version.properties), identité et permissions. Ses tests sont dans la suite commune
  # (ligne 32, job « build »).
  prestigepointage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Build APK Prestige Pointage
        run: flutter build apk --release --flavor pointage -t lib/main_pointage.dart

      - name: Version, identité et permissions de l'APK Prestige Pointage
        shell: bash
        run: |
          apk=build/app/outputs/flutter-apk/app-pointage-release.apk
          nom=$(sed -n 's/^nomVersion=//p' android/app/prestigepointage-version.properties | tr -d '[:space:]')
          code=$(sed -n 's/^codeVersion=//p' android/app/prestigepointage-version.properties | tr -d '[:space:]')
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2
          "$aapt2" dump badging "$apk" | grep -E "^(package|application-label|launchable-activity):"
          "$aapt2" dump badging "$apk" | grep -q "package: name='com.dici.prestigepointage' versionCode='$code' versionName='$nom'" \
            || { echo "::error title=Prestige Pointage::applicationId/version attendus com.dici.prestigepointage $nom+$code"; exit 1; }
          "$aapt2" dump badging "$apk" | grep -q "application-label:'Prestige Pointage'" || { echo "::error title=Prestige Pointage::nom affiché"; exit 1; }
          "$aapt2" dump permissions "$apk" | sort | tee permissions-pointage.txt
          grep -q "android.permission.CAMERA" permissions-pointage.txt || { echo "::error title=Prestige Pointage::permission caméra absente (photo de contrôle, badge)"; exit 1; }
          grep -q "android.permission.NFC" permissions-pointage.txt || { echo "::error title=Prestige Pointage::permission NFC absente (badges)"; exit 1; }
          if grep -q "ACCESS_FINE_LOCATION\|ACCESS_COARSE_LOCATION" permissions-pointage.txt; then echo "::error title=Prestige Pointage::la borne ne demande pas la position"; exit 1; fi
          mkdir -p prestigepointage-apk
          cp "$apk" "prestigepointage-apk/PrestigePointage-$nom.apk"
          {
            echo "## APK Prestige Pointage"
            echo "- \`com.dici.prestigepointage\` · version **$nom+$code** · $(du -h "$apk" | cut -f1)"
            echo "- Artefact : \`prestigepointage-apk\` (PrestigePointage-$nom.apk)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Prestige Pointage::$nom+$code"

      - uses: actions/upload-artifact@v4
        with:
          name: prestigepointage-apk
          path: prestigepointage-apk/*.apk
          retention-days: 30
